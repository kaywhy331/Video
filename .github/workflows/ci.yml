name: Validate VideoFactory

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: npm run validate

      - name: Audit locked dependencies
        run: npm run security:audit

      - name: Generate CycloneDX SBOM
        run: npm run security:sbom

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: VideoFactory-Desktop-${{ github.sha }}-validation-evidence
          path: |
            VALIDATION_ACCEPTANCE_RECEIPT.json
            VALIDATION_STATUS.json
            validation/results/vitest.json
            validation/results/playwright.json
            validation/results/pipeline.json
            release/videofactory-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm.cmd ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) {
              throw "Windows dependency installation failed after $maxAttempts attempts."
            }

            $delaySeconds = 15 * $attempt
            Write-Warning "Windows dependency installation attempt $attempt failed; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Validate Windows source and dependencies
        run: npm run doctor

      - name: Build Windows installer and archive
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PSNativeCommandUseErrorActionPreference = $false
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npx.cmd electron-builder --win nsis zip --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) {
              throw "Windows packaging failed after $maxAttempts attempts."
            }

            $delaySeconds = 15 * $attempt
            Write-Warning "Windows packaging attempt $attempt failed; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VideoFactory-Desktop-${{ github.sha }}-windows-unsigned
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
