name: Validate VideoFactory

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: npm run validate:release

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: VideoFactory-Desktop-${{ github.sha }}-validation-evidence
          path: |
            VALIDATION_ACCEPTANCE_RECEIPT.json
            VALIDATION_STATUS.json
            validation/results/vitest.json
            validation/results/playwright.json
            validation/results/pipeline.json
            validation/results/runtime-input.json
            validation/results/claims-input.json
            validation/results/electron-performance.json
            validation/external-qualification/index.json
            release/videofactory-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  package-windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm.cmd ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) {
              throw "Windows dependency installation failed after $maxAttempts attempts."
            }

            $delaySeconds = 15 * $attempt
            Write-Warning "Windows dependency installation attempt $attempt failed; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Validate Windows source and dependencies
        run: npm run doctor

      - name: Build Windows installer and archive
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PSNativeCommandUseErrorActionPreference = $false
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npx.cmd electron-builder --win nsis zip --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) {
              throw "Windows packaging failed after $maxAttempts attempts."
            }

            $delaySeconds = 15 * $attempt
            Write-Warning "Windows packaging attempt $attempt failed; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Smoke test packaged Windows artifacts
        shell: pwsh
        run: ./scripts/windows/test-packaged-app.ps1

      - name: Download exact-head validation evidence
        uses: actions/download-artifact@v7
        with:
          name: VideoFactory-Desktop-${{ github.sha }}-validation-evidence
          path: ${{ runner.temp }}/videofactory-validation-evidence

      - name: Attach evidence and verify release provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = '${{ runner.temp }}/videofactory-validation-evidence'
          $pipeline = Get-Content "$evidenceRoot/validation/results/pipeline.json" -Raw | ConvertFrom-Json
          if ($pipeline.qualification -ne 'release') {
            throw 'Downloaded validation evidence is not release-qualified.'
          }
          if ($pipeline.source.commit -ne '${{ github.sha }}' -or $pipeline.source.workflowCommit -ne '${{ github.sha }}') {
            throw 'Downloaded validation evidence does not match the exact workflow SHA.'
          }
          if ($pipeline.source.dirty -ne $false -or $pipeline.source.tree -notmatch '^[a-fA-F0-9]{40}$') {
            throw 'Downloaded validation evidence is dirty or has no exact source tree.'
          }
          New-Item -ItemType Directory -Force validation/results | Out-Null
          Copy-Item "$evidenceRoot/validation/results/pipeline.json" validation/results/pipeline.json
          Copy-Item "$evidenceRoot/validation/results/runtime-input.json" validation/results/runtime-input.json
          Copy-Item "$evidenceRoot/validation/results/claims-input.json" validation/results/claims-input.json
          Copy-Item "$evidenceRoot/validation/results/vitest.json" validation/results/vitest.json
          Copy-Item "$evidenceRoot/validation/results/playwright.json" validation/results/playwright.json
          Copy-Item "$evidenceRoot/release/videofactory-sbom.cdx.json" release/videofactory-sbom.cdx.json
          $externalIndex = "$evidenceRoot/validation/external-qualification/index.json"
          $externalReceipt = "$evidenceRoot/validation/results/electron-performance.json"
          if ((Test-Path $externalIndex) -xor (Test-Path $externalReceipt)) {
            throw 'Downloaded external qualification evidence is incomplete.'
          }
          if (Test-Path $externalIndex) {
            New-Item -ItemType Directory -Force validation/external-qualification | Out-Null
            New-Item -ItemType Directory -Force validation/results | Out-Null
            Copy-Item $externalIndex validation/external-qualification/index.json
            Copy-Item $externalReceipt validation/results/electron-performance.json
          }
          npm.cmd run qualify:index-windows-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/validate-acceptance.mjs --record-validated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item VALIDATION_ACCEPTANCE_RECEIPT.json release/VALIDATION_ACCEPTANCE_RECEIPT.json
          Copy-Item VALIDATION_STATUS.json release/VALIDATION_STATUS.json
          Copy-Item validation/results/pipeline.json release/VALIDATION_PIPELINE.json
          Copy-Item validation/results/runtime-input.json release/RUNTIME_INPUTS.json
          Copy-Item validation/results/claims-input.json release/CLAIMS_INPUTS.json
          Copy-Item validation/results/vitest.json release/VITEST_RESULTS.json
          Copy-Item validation/results/playwright.json release/PLAYWRIGHT_RESULTS.json
          npm.cmd run release:manifest -- --require-validation --require-package-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run release:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VideoFactory-Desktop-${{ github.sha }}-windows-unsigned
          path: |
            release/*.exe
            release/*.zip
            release/*.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
