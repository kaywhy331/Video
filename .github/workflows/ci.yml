name: Validate VideoFactory

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: npm run validate

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Windows source and dependencies
        run: npm run doctor

      - name: Build Windows installer and archive
        run: npm run package:win

      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VideoFactory-Desktop-${{ github.sha }}-windows-unsigned
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
