name: Import complete VideoFactory source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-full-videofactory-source.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct source archive from import branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/import-videofactory-alpha2
          WORK="$RUNNER_TEMP/videofactory-import"
          mkdir -p "$WORK/extracted" "$WORK/chunks"
          for file in \
            core-000.b64 \
            core-001.b64 \
            core-002.b64 \
            core-003.b64 \
            core-004.b64 \
            core-005.b64 \
            core-006.b64 \
            core-007a.b64 \
            core-007b.b64
          do
            git show "origin/agent/import-videofactory-alpha2:.source-bundle/$file" > "$WORK/chunks/$file"
          done

          python - "$WORK" <<'PY'
          import base64
          import itertools
          import io
          import pathlib
          import sys
          import zipfile

          work = pathlib.Path(sys.argv[1])
          names = [
              'core-000.b64', 'core-001.b64', 'core-002.b64',
              'core-003.b64', 'core-004.b64', 'core-005.b64',
              'core-006.b64', 'core-007a.b64', 'core-007b.b64'
          ]
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          choices = []

          for name in names:
              text = ''.join((work / 'chunks' / name).read_text().split())
              print(f'CHUNK {name} encoded_bytes={len(text)}')
              options = []
              if len(text) % 4 == 0:
                  options.append((None, base64.b64decode(text, validate=True)))
              elif len(text) % 4 == 3:
                  # The staged core-004 upload lost its final base64 character.
                  # Try every valid final character and let ZIP CRC validation choose it.
                  for char in alphabet:
                      try:
                          options.append((char, base64.b64decode(text + char, validate=True)))
                      except Exception:
                          pass
              else:
                  raise SystemExit(f'Unsupported base64 truncation in {name}: length={len(text)}')
              if not options:
                  raise SystemExit(f'No decodable candidates for {name}')
              choices.append(options)

          combinations = 1
          for options in choices:
              combinations *= len(options)
          if combinations > 4096:
              raise SystemExit(f'Too many repair combinations: {combinations}')

          for selected in itertools.product(*choices):
              archive = b''.join(item[1] for item in selected)
              try:
                  with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                      if bundle.testzip() is not None:
                          continue
                      required = {
                          'package.json',
                          'src/main/index.ts',
                          'src/renderer/src/App.tsx',
                          'src/shared/types.ts',
                          'RUN-ON-WINDOWS.cmd'
                      }
                      members = {name.rstrip('/') for name in bundle.namelist()}
                      roots = {member.split('/', 1)[0] for member in members if member}
                      direct = required.issubset(members)
                      nested = any(all(f'{root}/{path}' in members for path in required) for root in roots)
                      if not direct and not nested:
                          continue
                  (work / 'source.zip').write_bytes(archive)
                  repairs = {name: selected[index][0] for index, name in enumerate(names) if selected[index][0]}
                  print(f'ARCHIVE_OK bytes={len(archive)} repairs={repairs}')
                  break
              except (zipfile.BadZipFile, RuntimeError, OSError):
                  continue
          else:
              raise SystemExit('No repaired chunk combination produced a valid complete source ZIP')
          PY

          unzip -t "$WORK/source.zip"
          unzip -q "$WORK/source.zip" -d "$WORK/extracted"

          SOURCE_ROOT="$WORK/extracted"
          FIRST_DIR="$(find "$SOURCE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
          ROOT_FILE_COUNT="$(find "$SOURCE_ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          ROOT_DIR_COUNT="$(find "$SOURCE_ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          if [[ "$ROOT_FILE_COUNT" == "0" && "$ROOT_DIR_COUNT" == "1" && -n "$FIRST_DIR" ]]; then
            SOURCE_ROOT="$FIRST_DIR"
          fi

          test -f "$SOURCE_ROOT/package.json"
          test -f "$SOURCE_ROOT/src/main/index.ts"
          test -f "$SOURCE_ROOT/src/renderer/src/App.tsx"
          test -f "$SOURCE_ROOT/src/shared/types.ts"
          test -f "$SOURCE_ROOT/RUN-ON-WINDOWS.cmd"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE_ROOT/" ./

      - name: Add release status notice
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE-BLOCKED.md <<'EOF'
          # Release blocked

          This repository contains the complete VideoFactory Desktop alpha.2 source tree, but the application is **not production-ready**.

          Do not connect a live YouTube channel or rely on the current automated geographic verification, licensing, quality-control, render-cache, or upload-idempotency paths until the documented P0 defects are corrected.

          The current build is suitable for development and local evaluation only.
          EOF

          if ! grep -q "Release blocked" README.md; then
            tmp="$(mktemp)"
            cat > "$tmp" <<'EOF'
          > [!WARNING]
          > **Release blocked:** this alpha is a development prototype, not a production publishing system. Do not connect a live YouTube channel or rely on automated geographic/license verification until the documented P0 defects are corrected. See [`RELEASE-BLOCKED.md`](RELEASE-BLOCKED.md).

          EOF
            cat README.md >> "$tmp"
            mv "$tmp" README.md
          fi

      - name: Commit expanded project to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "feat: add complete VideoFactory Desktop alpha.2 source"
          git push origin HEAD:main
